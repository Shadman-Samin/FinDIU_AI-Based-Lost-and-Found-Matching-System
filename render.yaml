services:
  - type: web
    name: findiu-api
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: python -m alembic -c backend/alembic.ini upgrade head && uvicorn backend.app.main:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_TICK_TOKEN
        generateValue: true
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: MATCHING_MODE
        value: local
      - key: STORAGE_PROVIDER
        value: supabase
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
