services:
  - type: web
    name: findiu-api
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: python -m alembic -c backend/alembic.ini upgrade head && uvicorn backend.app.main:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_TICK_TOKEN
        generateValue: true
      - key: EMBEDDING_PROVIDER
        value: local
      - key: MATCHING_MODE
        value: local
      - key: STORAGE_PROVIDER
        value: supabase
      - key: STORAGE_BUCKET
        value: findiu-images
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://findiu.vercel.app
      - key: ALLOWED_ORIGINS
        value: '["https://findiu.vercel.app"]'
