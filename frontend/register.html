<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FinDIU | Register</title><link rel="stylesheet" href="style.css"><script defer src="js/config.js"></script><script defer src="js/i18n.js"></script><script defer src="js/api.js"></script><script defer src="js/session.js"></script><script defer src="js/auth.js"></script></head>
<body data-page="register"><header class="topbar" data-shell></header><main id="main" class="page"><div class="auth-layout"><section class="auth-aside"><p class="eyebrow" data-i18n="eyebrow"></p><h1 data-i18n="register_title"></h1><p class="lede" data-i18n="register_intro"></p><p class="desk-note" data-i18n="privacy_copy"></p></section><section class="form-panel"><p class="eyebrow">F / 02</p><h2 data-i18n="create_account"></h2><form data-auth="register" novalidate><label class="field"><span data-i18n="name">নাম</span><input name="name" autocomplete="name" maxlength="120" required></label><label class="field"><span data-i18n="email"></span><input type="email" name="email" autocomplete="username" maxlength="254" required></label><label class="field"><span data-i18n="password"></span><span class="password-wrap"><input id="password" type="password" name="password" autocomplete="new-password" minlength="12" maxlength="128" aria-describedby="password-help" required><button type="button" data-password aria-controls="password" aria-pressed="false" data-i18n="show"></button></span><span id="password-help" class="hint" data-i18n="password_help"></span></label><p class="form-error" data-status role="alert"></p><button class="button" type="submit" data-i18n="create_account"></button></form><p class="form-end"><span data-i18n="already"></span> <a href="auth.html" data-auth-switch data-i18n="sign_in"></a></p></section></div></main><footer class="footer" data-footer></footer></body></html>
