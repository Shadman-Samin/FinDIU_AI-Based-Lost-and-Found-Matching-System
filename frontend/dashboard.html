<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1D4ED8"><title>FinDIU | My reports</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css">
  <script defer src="js/config.js"></script><script defer src="js/i18n.js"></script><script defer src="js/api.js"></script><script defer src="js/session.js"></script><script defer src="js/components.js"></script><script defer src="js/dashboard.js"></script>
</head>
<body data-page="dashboard">
  <header class="topbar" data-shell></header>
  <main id="main" class="page">
    <div class="page-heading"><div><h1 data-i18n="dashboard_title"></h1><p class="lede" data-i18n="dashboard_intro"></p></div><span class="result-count" data-result-count aria-live="polite"></span></div>
    <section aria-label="Your reports"><div class="search-filter-bar" data-search-filter></div><div class="records" data-my-list></div><div class="pagination"><button class="button button-light" type="button" data-load-more data-i18n="load_more" hidden></button></div></section>
    <section aria-labelledby="claims-heading"><div class="section-head"><h2 id="claims-heading" data-i18n="claims"></h2></div><p class="hint" data-i18n="handover_info"></p><div class="claim-list" data-claims></div><div class="pagination"><button class="button button-light" data-more-claims type="button" data-i18n="load_more" hidden></button></div></section>
  </main><footer class="footer" data-footer></footer>
</body>
</html>
