<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FinDIU | New report</title><meta name="theme-color" content="#F4EEE2"><link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="stylesheet" href="style.css"><script defer src="js/config.js"></script><script defer src="js/i18n.js"></script><script defer src="js/api.js"></script><script defer src="js/session.js"></script><script defer src="js/report.js"></script></head>
<body data-page="report"><header class="topbar" data-shell></header><main id="main" class="page"><div class="page-heading"><div><p class="eyebrow" data-i18n="new_report"></p><h1 data-i18n="report_title"></h1><p class="lede" data-i18n="report_intro"></p></div></div>
<div class="report-layout"><form class="report-form" data-report-form novalidate><p class="desk-note" data-edit-notice hidden></p><div class="form-error" data-load-error role="alert"></div>
<fieldset><legend data-i18n="basics"></legend><div class="form-grid"><label class="field"><span data-i18n="type"></span><select name="type"><option value="lost" data-i18n="lost"></option><option value="found" data-i18n="found"></option></select></label><label class="field"><span data-i18n="category"></span><select required name="category" data-vocab="categories"></select></label><label class="field full"><span data-i18n="title"></span><input required minlength="3" maxlength="120" name="title"></label><label class="field"><span data-i18n="color"></span><select required name="color" data-vocab="colors"></select></label><label class="field"><span data-i18n="brand_field"></span><input name="brand" maxlength="120"></label><label class="field full"><span data-i18n="description"></span><textarea required minlength="10" maxlength="2000" name="description" aria-describedby="description-help"></textarea><span class="hint" id="description-help" data-i18n="description_help"></span></label><div class="field full"><label for="image" data-i18n="photo"></label><div class="upload-zone"><span class="hint" id="image-help" data-i18n="upload_help"></span><input id="image" type="file" name="image" accept="image/jpeg,image/png" aria-describedby="image-help"><img class="upload-preview" data-preview alt="" hidden><button type="button" class="text-button" data-remove-image data-i18n="remove" hidden></button></div></div></div></fieldset>
<fieldset><legend data-i18n="whereabouts"></legend><div class="form-grid"><label class="field"><span data-i18n="location"></span><select required name="location" data-vocab="locations"></select></label><div class="field"><label for="event-date" data-i18n="event_date"></label><input id="event-date" required type="date" name="event_date"><div class="date-shortcuts"><button type="button" class="text-button" data-date="0" data-i18n="today"></button><button type="button" class="text-button" data-date="1" data-i18n="yesterday"></button></div></div></div></fieldset>
<fieldset><legend data-i18n="proof"></legend><label class="field"><span data-i18n="private_label">Private verification detail</span><textarea required minlength="3" maxlength="1000" name="private_detail" aria-describedby="private-help"></textarea><span class="hint" id="private-help" data-i18n="private_help">নাম ও গোপন তথ্য সুরক্ষিত রাখুন।</span></label><label class="check-field"><input required type="checkbox" name="consent" aria-describedby="consent-help"><span data-i18n="consent"></span></label><p class="hint" id="consent-help" data-i18n="consent_help"></p></fieldset>
<p class="form-error" data-status role="alert"></p><div class="form-submit"><a href="dashboard.html" data-i18n="back"></a><button class="button" type="submit" data-i18n="submit_report" disabled></button></div></form>
<aside class="report-aside"><div class="ticket"><div class="ticket-top"><span class="eyebrow">FIN / DIU</span><span class="meta">03</span></div><div class="ticket-body"><h2 data-i18n="privacy"></h2><p class="hint" data-i18n="private_help"></p></div><div class="perforation"><p class="hint" data-i18n="ownership_note"></p></div></div></aside></div></main><footer class="footer" data-footer></footer></body></html>
