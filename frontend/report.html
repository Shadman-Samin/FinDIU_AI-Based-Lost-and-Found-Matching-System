<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1D4ED8"><title>FinDIU | Report an item</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css">
  <script defer src="js/config.js"></script><script defer src="js/i18n.js"></script><script defer src="js/api.js"></script><script defer src="js/session.js"></script><script defer src="js/components.js"></script><script defer src="js/report.js"></script>
</head>
<body data-page="report">
  <header class="topbar" data-shell></header>
  <main id="main" class="page">
    <div class="page-heading"><div><h1 data-i18n="report_title"></h1><p class="lede" data-i18n="report_intro"></p></div><div class="report-type" role="group" data-report-type><button type="button" data-type="lost" aria-pressed="true" data-i18n="lost"></button><button type="button" data-type="found" aria-pressed="false" data-i18n="found"></button></div></div>
    <div class="report-layout">
      <form class="report-form" data-report-form novalidate>
        <select name="type" hidden aria-label="Report type"><option value="lost">Lost</option><option value="found">Found</option></select>
        <p class="desk-note" data-edit-notice hidden></p><div class="form-error" data-load-error role="alert"></div>
        <fieldset><legend class="sr-only" data-i18n="basics"></legend><div class="form-grid">
          <label class="field full"><span data-i18n="title"></span><input required minlength="3" maxlength="120" name="title" data-i18n-placeholder="title_placeholder"></label>
          <label class="field"><span data-i18n="category"></span><select required name="category" data-vocab="categories"></select></label>
          <label class="field"><span data-i18n="location"></span><select required name="location" data-vocab="locations"></select></label>
          <label class="field"><span data-i18n="color"></span><select required name="color" data-vocab="colors"></select></label>
          <label class="field"><span data-i18n="brand_field"></span><input name="brand" maxlength="120"></label>
          <div class="field full"><label for="event-date" data-i18n="event_date"></label><input id="event-date" required type="date" name="event_date"><div class="date-shortcuts"><button type="button" class="text-button" data-date="0" data-i18n="today"></button><button type="button" class="text-button" data-date="1" data-i18n="yesterday"></button></div></div>
          <label class="field full"><span data-i18n="description"></span><textarea required minlength="10" maxlength="2000" name="description" aria-describedby="description-help" data-i18n-placeholder="description_placeholder"></textarea><span class="hint" id="description-help" data-i18n="description_help"></span></label>
          <div class="field full"><label for="image" data-i18n="photo"></label><div class="upload-zone"><span class="hint" id="image-help" data-i18n="upload_help"></span><input id="image" type="file" name="image" accept="image/jpeg,image/png" aria-describedby="image-help"><img class="upload-preview" data-preview alt="" hidden><button type="button" class="text-button" data-remove-image data-i18n="remove" hidden></button></div></div>
        </div></fieldset>
        <fieldset class="private-section"><legend data-i18n="private_label">Private verification detail</legend><label class="field"><span class="sr-only" data-i18n="private_label">Private verification detail</span><textarea required minlength="3" maxlength="1000" name="private_detail" aria-describedby="private-help"></textarea><span class="hint" id="private-help" data-i18n="private_help">নাম ও গোপন তথ্য সুরক্ষিত রাখুন।</span></label></fieldset>
        <label class="check-field"><input required type="checkbox" name="consent" aria-describedby="consent-help"><span data-i18n="consent"></span></label><p class="hint" id="consent-help" data-i18n="consent_help"></p>
        <p class="form-error" data-status role="alert"></p><div class="form-submit"><a class="button button-light" href="dashboard.html" data-i18n="cancel"></a><button class="button" type="submit" data-i18n="submit_report" disabled></button></div>
      </form>
      <aside class="report-aside" data-live-matches></aside>
    </div>
  </main><footer class="footer" data-footer></footer>
</body>
</html>
