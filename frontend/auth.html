<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1D4ED8"><meta http-equiv="refresh" content="0; url=dashboard.html"><title>FinDIU | Sign in</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css">
  <script defer src="js/config.js"></script><script defer src="js/i18n.js"></script><script defer src="js/api.js"></script><script defer src="js/session.js"></script><script defer src="js/components.js"></script><script defer src="js/auth.js"></script>
</head>
<body data-page="auth">
  <header class="topbar" data-shell></header>
  <main id="main" class="page"><div class="auth-layout">
    <section class="auth-aside"><h1 data-i18n="auth_title"></h1><p class="lede" data-i18n="auth_intro"></p><div class="desk-note"><h2 data-i18n="private_workspace"></h2><p data-i18n="privacy_copy"></p></div></section>
    <section class="form-panel" aria-labelledby="sign-in-heading"><h2 id="sign-in-heading" data-i18n="sign_in"></h2>
      <form data-auth="login" novalidate>
        <label class="field"><span data-i18n="email"></span><input type="email" name="email" autocomplete="username" maxlength="254" required></label>
        <label class="field"><span data-i18n="password"></span><span class="password-wrap"><input id="password" type="password" name="password" autocomplete="current-password" maxlength="128" required><button type="button" data-password aria-controls="password" aria-pressed="false" data-i18n="show"></button></span></label>
        <p class="form-error" data-status role="alert"></p><button class="button" type="submit" data-i18n="sign_in"></button>
      </form>
      <p class="form-end"><span data-i18n="new_here"></span> <a href="register.html" data-auth-switch data-i18n="create_account"></a></p>
    </section>
  </div></main><footer class="footer" data-footer></footer>
</body>
</html>
