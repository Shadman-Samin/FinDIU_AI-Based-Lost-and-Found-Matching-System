[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "findiu"
version = "0.1.0"
description = "Explainable, privacy-conscious campus lost-and-found matching."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.12,<0.116",
    "uvicorn>=0.34,<1",
    "pydantic-settings>=2.8,<3",
    "sqlalchemy>=2.0.38,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.15,<2",
    "pyjwt>=2.10,<3",
    "argon2-cffi>=23.1,<26",
    "pillow>=11.1,<13",
    "httpx>=0.28,<1",
    "google-genai>=1.10,<3",
    "python-multipart>=0.0.20,<1",
    "email-validator>=2.2,<3",
    "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a dedicated PostgreSQL test database"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
